name: citations

# Weekly drift check: mathcomp reorganizes ~10%/year and the
# `file.v:line` / `(l. NNN)` citations in reference.md + domains/*.md
# go stale silently. Installing the full pinned stack is heavy, so we
# run this on a schedule (not per-PR) plus on manual dispatch.
#
# Pins (keep in sync with README.md / LAST_VERIFIED.md "Target versions"):
#   Rocq 9.1.1 | mathcomp 2.5.0 | mathcomp-analysis 1.16.0

on:
  schedule:
    # 06:17 UTC every Monday (off the top of the hour to avoid the
    # scheduler stampede).
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-citations:
    runs-on: ubuntu-latest
    # The pinned Rocq toolchain lives in this image; we opam-install
    # mathcomp + analysis at the pinned versions on top of it.
    #
    # NB: coqorg/coq only publishes Coq <= 8.20.1. Rocq >= 9.0 images
    # live in rocq/rocq-prover, where the unprivileged user is `rocq`
    # (not `coq`) and the released opam repo is preregistered as
    # `rocq-released` for all switches.
    container:
      image: rocq/rocq-prover:9.1.1
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned mathcomp + analysis
        run: |
          set -eux
          chown -R rocq:rocq .
          su rocq -c '
            set -eux
            eval $(opam env)
            opam update
            # The coq-mathcomp-* names are now thin compatibility shims,
            # and coq-mathcomp-ssreflect drags in the transitional
            # coq-core package. Install the rocq-* packages directly.
            opam install -y \
              rocq-mathcomp-ssreflect.2.5.0 \
              rocq-mathcomp-algebra.2.5.0 \
              rocq-mathcomp-field.2.5.0 \
              rocq-mathcomp-analysis.1.16.0
          '

      - name: Run citation check (strict)
        run: |
          set -eux
          su rocq -c '
            set -eux
            eval $(opam env)
            # Rocq 9 ships one "rocq" binary with subcommands; there is no
            # rocqc, and coqc is packaged in coq-core, which this image
            # omits. "rocq c -where" is the coqc -where equivalent.
            COQLIB="$(rocq c -where)"
            for cand in "$COQLIB/user-contrib/mathcomp" \
                        "$COQLIB/../coq/user-contrib/mathcomp"
            do
              if [ -d "$cand" ]; then
                MATHCOMP_ROOT="$(cd "$cand" && pwd)"
                break
              fi
            done
            [ -n "${MATHCOMP_ROOT:-}" ] || {
              echo "mathcomp tree not found under $COQLIB" >&2
              exit 1
            }
            export MATHCOMP_ROOT
            cd skills/mathcomp-skills
            bash scripts/check-citations.sh --strict --require-mathcomp \
              --verbose
          '
